# Config file for models from MetaAi

# Meta UMA: A Family of Universal Models for Atoms (Jan 2026)
# https://huggingface.co/facebook/UMA
# published paper: https://ai.meta.com/research/publications/uma-a-family-of-universal-models-for-atoms/

# Checkpoints for UMA models, trained on the entirety of OC20, ODAC23, OMat24, OMC25, and OMol25 datasets.
uma-s-1:
  description: 'Version 1.0 of UMA model, trained using 150M parameters with 6M active.'
  group: MetaAi
  image_file: Images/Meta/uma-s-1.sif
  container_definition: Definitions/Meta/UMA.def
  build_options: {'HF_AUTH':True,'checkpoint_file':'checkpoints/uma-s-1.pt', 'model_name':'uma-s-1'}

uma-s-1p1:
  description: 'Version 1.1 of UMA model, trained using 150M parameters with 6M active.'
  group: MetaAi
  image_file: Images/Meta/uma-s-1p1.sif
  container_definition: Definitions/Meta/UMA.def
  build_options: {'HF_AUTH':True,'checkpoint_file':'checkpoints/uma-s-1p1.pt', 'model_name':'uma-s-1p1'}

uma-m-1p1:
  description: 'Version 1.1 of UMA model, trained using 1.4B parameters with 50M active.'
  group: MetaAi
  image_file: Images/Meta/uma-m-1p1.sif
  container_definition: Definitions/Meta/UMA.def
  build_options: {'HF_AUTH':True,'checkpoint_file':'checkpoints/uma-m-1p1.pt', 'model_name':'uma-m-1p1'}

# single container with all models
uma:
  description: 'Single container with all UMA models installed.'
  group: MetaAi
  image_file: Images/Meta/UMA.sif
  container_definition: Definitions/Meta/UMA.def
  build_options: {'HF_AUTH':True,'checkpoint_file':'', 'model_name':'uma_all'}

