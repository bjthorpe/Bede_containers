[project]
name = "bede-containers"
version = "0.9.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dacite>=1.9.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
pytest = []

[dependency-groups]
dev = [
    "black>=26.1.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[project.scripts]
ml-toolkit = "bede_containers:main"

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

#[tool.uv.build-backend]
#source-include = ["src/your_package/**"]

[tool.uv.build-backend]
data = { data = "Data", scripts = "scripts" }