global
    maxconn MAX_CONNS
    log stdout format raw local0 debug

# Don't need stats on production server, but left here for ease of testing
frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST
    stats admin if TRUE 

defaults
    log global
    timeout connect 1s
    timeout client  TIMEOUT_OVERWRITEs
    timeout server  TIMEOUT_OVERWRITEs

frontend predict
    mode tcp
    option tcplog
    bind *:LISTEN_PORT
    default_backend call_response
    timeout client TIMEOUT_OVERWRITEs

backend call_response

    mode tcp
    balance leastconn
    timeout queue TIMEOUT_OVERWRITEs

    # For health checking we use the tcp health check. This sends the string CHECK
    # to the TCP server and expects the (string) response ALIVE.
    # N.B. 05000000 is 5 in an unsigned integer in little enidian specifying length of sent message.
    #      434845434B is CHECK in hex.
    # Anything else is treated as a failure of the health check
    option tcp-check
    tcp-check send-binary "05000000434845434B"
    tcp-check expect string ALIVE

    # Setup the default server methods
    # Check every 5 seconds, take server offline after 3 failures,
    #   require 1 successful healthcheck to re-up a server.
    default-server maxconn 1 check on-marked-down shutdown-sessions inter 5s fall 3 rise 1

    # SEVERS GO DIRECTLY BELOW HERE, WILL BE ADDED AT RUNTIME DYNAMICALLY
