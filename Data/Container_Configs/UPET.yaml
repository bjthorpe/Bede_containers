# Config file for MatterSim

PET-OAM-XL:
  description: 'extra Large version of PET-OAM, Note: this is the Model submitted to Matbench discovery. trained on OMat -> sAlex+MPtrj. Recommend for material discovery tasks (convex hull energies, geometry optimization, phonons, etc).'
  groups: ['MatBench','UPET']
  image_file: Images/UPET/PET-OAM-XL.sif
  container_definition: Definitions/UPET/UPET.def
  build_options: {'checkpoint_file':'pet-oam-xl-v1.0.0.ckpt', 'model_name':'PET-OAM-XL'}
  CASTEP: True

PET-OAM-L:
  description: 'Large version of PET-OAM UPET Model trained on OMat -> sAlex+MPtrj. Recommend for material discovery tasks (convex hull energies, geometry optimization, phonons, etc)'
  groups: ['MatBench','UPET']
  image_file: Images/UPET/PET-OAM-L.sif
  container_definition: Definitions/UPET/UPET.def
  build_options: {'checkpoint_file':'pet-oam-l-v0.1.0.ckpt', 'model_name':'PET-OAM-L'}
  CASTEP: True

