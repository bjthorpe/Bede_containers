# Config file for pre-trained models from (ORB-V)
# Full details of available models can be found at:
# https://github.com/orbital-materials/orb-models/blob/main/MODELS.md

# ORB-V3 Models
ORB-v3:
  description: "Identical to ORB-v3-conservative-inf-omat, this is the model ranked on matbench discovery."
  groups: ['ORB-v3','Matbench']
  image_file: Images/ORB-V/ORB-v3.sif
  container_definition: Definitions/ORB-V/ORB-V.def
  build_options: {'model_name':'ORB-v3','url':"https://orbitalmaterials-public-models.s3.us-west-1.amazonaws.com/forcefields/orb-v3/orb-v3-conservative-inf-omat-20250404.ckpt"} 
  CASTEP: True

ORB-v3-conservative-omol:  
  groups: ['ORB-v3']
  description: "ORB v3 Conservative with effectively unlimited neighbors, trained on OMol25. Effectively unlimited, in this case means that the model will use all neighbors within 6A the cutoff radius. Empirically, for the training distribution, 120 is sufficient."
  image_file: Images/ORB-V/ORB-v3-conservative-omol.sif
  container_definition: Definitions/ORB-V/ORB-V.def
  build_options: {'model_name':'ORB-v3-conservative-omol','url':'https://orbitalmaterials-public-models.s3.us-west-1.amazonaws.com/forcefields/orb-v3-conservative-omol-20250820.ckpt'} 
  CASTEP: True

ORB-v3-direct-omol:
  groups: ['ORB-v3']
