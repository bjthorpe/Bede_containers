# Config file for pre-trained models fromTensor Materials Representation and Interaction Simulation (MatRIS)
# Full details of available models can be found at https://github.com/HPC-AI-Team/MatRIS/tree/main

MatRIS_10M_OAM:
  description: 'MatRIS is a foundation model for materials representation and interaction simulation.' 
  groups: ['MatRIS','Matbench']
