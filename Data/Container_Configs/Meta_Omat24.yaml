# Config file for models from ['MatBench','Meta','OMAT24']

# Meta Open Materials 2024 (OMat24) Models
# https://huggingface.co/facebook/OMAT24

# Models trained only on MPtrj only
eqV2-L-DeNS:
  description: 'EquiformerV2 model trained on MPtrj dataset only, using 153M parameters with denoising augmentation objectives (DeNS).'
  groups: ['Meta','OMAT24']
  image_file: Images/Meta/eqV2-L-DeNS.sif
  container_definition: Definitions/Meta/OMat24.def
  build_options: {'HF_AUTH':True,'checkpoint_file':'eqV2_dens_153M_mp.pt','model_name':'eqV2-L-DeNS'}
  CASTEP: True

eqV2-M-DeNS:
  description: 'EquiformerV2 model trained on MPtrj dataset only, using 86M parameters with denoising augmentation objectives (DeNS).'
