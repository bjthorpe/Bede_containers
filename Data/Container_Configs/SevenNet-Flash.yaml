# Config file for pre-trained models from Sevennet
# full details of available models can be found here: https://sevennet.readthedocs.io/en/latest/user_guide/pretrained.html#sevennet-omat

SevenNet-Omni-Flash:
  description: 'SevenNet Recommend model trained on 15 abinitio datasets' 
  groups: ['SevenNet']
  image_file: Images/SevenNet/SevenNet-Omni.sif
  container_definition: Definitions/SevenNet/SevenNet.def
  build_options: {'model_name':'SevenNet-Omni','Flash'}
  CASTEP: True
  available_tasks: ['mpa','omat24','matpes_pbe','oc20','oc22','odac23','omol25_low','omol25_high','spice','qcml','pet_mad','mp r2scan','matpes_r2scan']

SevenNet-Omni-i8-Flash:
  description: 'SevenNet-Omni-i8 follows the same training strategy as SevenNet-Omni, except with an increased model capacity.' 
  groups: ['SevenNet','Flash']
  image_file: Images/SevenNet/SevenNet-Omni-i8.sif
  container_definition: Definitions/SevenNet/SevenNet.def
  build_options: {'model_name':'SevenNet-Omni-i8'}
  CASTEP: True
  available_tasks: ['mpa','omat24','matpes_pbe','oc20','oc22','odac23','omol25_low','omol25_high','spice','qcml','pet_mad','mp r2scan','matpes_r2scan']

SevenNet-Omni-i12-Flash:
  description: 'SevenNet-Omni-i12 follows the same training strategy as SevenNet-Omni, except with an increased model capacity.' 
  groups: ['SevenNet','Flash']
  image_file: Images/SevenNet/SevenNet-Omni-i12.sif
  container_definition: Definitions/SevenNet/SevenNet.def
  build_options: {'model_name':'SevenNet-Omni-i12'}
  CASTEP: True
  available_tasks: ['mpa','omat24','matpes_pbe','oc20','oc22','odac23','omol25_low','omol25_high','spice','qcml','pet_mad','mp r2scan','matpes_r2scan']

SevenNet-MF-ompa-Flash:
  description: 'SevenNet Model trained on the MPtrj, sAlex and OMat24 datasets.' 
  groups: ['SevenNet','Flash']
  image_file: Images/SevenNet/SevenNet-MF-ompa.sif
  container_definition: Definitions/SevenNet/SevenNet.def
  build_options: {'model_name':'SevenNet-MF-ompa'}
  CASTEP: True
  available_tasks: ['mpa','omat24']

SevenNet-omat-Flash:
  description: 'SevenNet Model trained on just the OMat24 dataset. outperforms SevenNet-l3i5 on most tasks, except for the isolated molecule energy.' 
  groups: ['SevenNet','Flash']
  image_file: Images/SevenNet/SevenNet-omat.sif
  container_definition: Definitions/SevenNet/SevenNet.def
  build_options: {'model_name':'SevenNet-omat'}
  CASTEP: True

SevenNet-0-Flash:
  description: 'early pre-trained model trained on the MPtrj dataset. Sevennet recommend using newer and more accurate models, it can still be useful in certain cases due to its short inference time.' 
  groups: ['SevenNet','Flash']
  image_file: Images/SevenNet/SevenNet-0.sif
  container_definition: Definitions/SevenNet/SevenNet.def
  build_options: {'model_name':'SevenNet-0'}
  CASTEP: True

SevenNet-l3i5-Flash:
  description: 'This model increases the maximum spherical harmonic degree (lmax) to 3, compared to SevenNet-0, which has an lmax of 2. While l3i5 offers improved accuracy for various systems, it is approximately four times slower than SevenNet-0.'
  groups: [SevenNet','Flash']
  image_file: Images/SevenNet/SevenNet-l3i5.sif
  container_definition: Definitions/SevenNet/SevenNet.def
  build_options: {'model_name':'SevenNet-l3i5'}
  CASTEP: True

EquFlash:
    description: 'Note: This is a placeholder. Unfortunately EquFlash is not available at this time as the Developers have chosen not to release a pre-trained checkpoint. All we have to go on is its a scaled-up model derived from SevenNet-0 accelerated with FlashTP. As such please use on of the other flash enabled models.'
    groups: ['MatBench','Flash']
    image_file: Images/SevenNet/EquFlash.sif
    container_definition: Definitions/SevenNet/EquFlash.def
